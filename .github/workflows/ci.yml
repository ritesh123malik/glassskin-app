name: CI — Typecheck, Lint & Test

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for accurate changelogs / affected checks

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps required because react@19.2 has peer conflicts
        # with some Expo/RN testing libraries (documented in jest.setup.js)
        run: npm install --legacy-peer-deps

      # -------------------------------------------------------------------
      # Step 1: TypeScript — fails the PR on any type error
      # -------------------------------------------------------------------
      - name: TypeScript typecheck
        run: npm run typecheck

      # -------------------------------------------------------------------
      # Step 2: ESLint — fails on errors (not warnings)
      # ESLint is configured to error on unused vars, no-debugger, etc.
      # -------------------------------------------------------------------
      - name: ESLint lint
        run: npm run lint

      # -------------------------------------------------------------------
      # Step 3: Unit + Integration tests with coverage
      # Fails if any test fails OR if coverage thresholds are not met.
      # Coverage thresholds: 70% for src/utils/, minimums for src/store/
      # -------------------------------------------------------------------
      - name: Run tests
        run: npm test -- --ci --reporters=default --reporters=github-actions
        env:
          # Provide dummy env vars so supabaseClient.ts validation doesn't crash
          # at module load time. Real secrets are never needed for unit tests.
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      # -------------------------------------------------------------------
      # Upload coverage report as a job artifact for inspection
      # -------------------------------------------------------------------
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # -------------------------------------------------------------------
  # Job: Supabase Migration Lint
  # Validates SQL migrations for syntax errors and drift
  # -------------------------------------------------------------------
  migration-lint:
    name: Supabase Migration Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      supabase:
        image: supabase/postgres:15.3.0.071
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Start local Supabase
        run: |
          supabase init --db-url postgres://postgres:postgres@localhost:5432/postgres
          supabase start -d &
          sleep 10
          supabase db push --db-url postgres://postgres:postgres@localhost:5432/postgres

      - name: Lint migrations
        run: |
          for file in supabase/migrations/*.sql; do
            echo "Linting $file..."
            psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -f "$file" > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "::error::Migration syntax error in $file"
              psql postgres://postgres:postgres@localhost:5432/postgres -f "$file" 2>&1
              exit 1
            fi
          done
          echo "All migrations passed syntax validation"

      - name: Verify migration order
        run: |
          ls -1 supabase/migrations/*.sql | sort -t_ -k4 -n | diff - <(ls -1 supabase/migrations/*.sql) || {
            echo "::error::Migrations are not in chronological order"
            exit 1
          }
          echo "Migration order is correct"

      - name: Stop Supabase
        if: always()
        run: supabase stop -d || true

  # -------------------------------------------------------------------
  # Job: Schema Drift Check
  # Regenerates TypeScript types from the live Supabase schema and
  # fails the PR if the output differs from the committed file.
  # -------------------------------------------------------------------
  schema-drift-check:
    name: Supabase Schema Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Generate types from live schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript --project-id afevhbneeoqzmccwhkyx > /tmp/database.types.ts

      - name: Compare generated types with committed file
        run: |
          if diff -u src/types/database.types.ts /tmp/database.types.ts; then
            echo "✅ Schema types are in sync"
          else
            echo "::error::Schema drift detected: src/types/database.types.ts is out of sync with the live Supabase schema"
            echo ""
            echo "Run the following locally to update the committed types:"
            echo "  npm run gen:types"
            exit 1
          fi
